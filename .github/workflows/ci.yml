name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Train the risk model
        # The artifact is committed, but retraining here proves the pipeline
        # still works end to end and catches a training script that has rotted.
        run: python -m src.train

      - name: Run the test suite
        run: python -m pytest -q

      - name: Verify the server boots and serves the app
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8000 &
          sleep 8
          curl --fail --silent http://127.0.0.1:8000/api/model-info > /dev/null
          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
          echo "Server is healthy."
